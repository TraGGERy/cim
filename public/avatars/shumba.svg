<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shumbaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shumbaSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c5338"/>
      <stop offset="100%" stop-color="#5f3521"/>
    </linearGradient>
    <linearGradient id="shumbaHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2a29"/>
      <stop offset="70%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="shumbaBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassesGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cimBadgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shumbaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="96" fill="url(#shumbaBg)"/>
  
  <!-- Outer Gold Laurel Accent Ring -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 4"/>

  <!-- Bust & Professional Suit -->
  <g filter="url(#shumbaShadow)">
    <!-- Light Blue Oxford Collar Shirt -->
    <path d="M78 140 L122 140 L128 200 L72 200 Z" fill="#e0f2fe"/>
    <polygon points="100,150 90,140 100,132 110,140" fill="#0284c7"/>
    <!-- Navy Tie -->
    <path d="M96 142 L104 142 L107 185 L100 195 L93 185 Z" fill="#1e3a8a"/>
    <path d="M95 142 L105 142 L103 154 L97 154 Z" fill="#172554"/>

    <!-- Navy Senior Academic Blazer -->
    <path d="M38 200 C38 162 62 140 80 138 L100 178 L120 138 C138 140 162 162 162 200 Z" fill="url(#shumbaBlazer)"/>
    
    <!-- Lapels -->
    <path d="M80 138 L100 178 L78 200 L56 200 Z" fill="#0f172a"/>
    <path d="M120 138 L100 178 L122 200 L144 200 Z" fill="#0f172a"/>

    <!-- CIM Lapel Gold Pin -->
    <g transform="translate(64, 155)">
      <circle cx="6" cy="6" r="6" fill="url(#cimBadgeGold)"/>
      <polygon points="6,2 7.5,5 11,5.5 8.5,8 9,11 6,9.5 3,11 3.5,8 1,5.5 4.5,5" fill="#ffffff"/>
    </g>

    <!-- Neck -->
    <path d="M86 114 L114 114 L114 142 C114 147 86 147 86 142 Z" fill="#713f27"/>
    <path d="M86 114 L114 114 L112 128 C105 132 95 132 88 128 Z" fill="#5a311e" opacity="0.4"/>

    <!-- Head / Face -->
    <ellipse cx="100" cy="95" rx="31" ry="36" fill="url(#shumbaSkin)"/>

    <!-- Distinguished Trimmed Beard & Mustache -->
    <path d="M72 95 C72 124 82 138 100 138 C118 138 128 124 128 95 C128 116 122 133 100 133 C78 133 72 116 72 95 Z" fill="url(#shumbaHair)"/>
    <path d="M84 114 Q100 110 116 114 C118 119 110 120 100 119 C90 120 82 119 84 114 Z" fill="url(#shumbaHair)"/>
    <!-- Salt & Pepper Beard Highlights -->
    <path d="M90 128 Q100 132 110 128" fill="none" stroke="#9ca3af" stroke-width="1.2" opacity="0.6"/>
    <path d="M86 122 Q100 126 114 122" fill="none" stroke="#9ca3af" stroke-width="1.2" opacity="0.6"/>

    <!-- Hair (Distinguished Fade with silver temples) -->
    <path d="M68 84 C68 56 80 46 100 46 C120 46 132 56 132 84 C132 72 124 60 100 60 C76 60 68 72 68 84 Z" fill="url(#shumbaHair)"/>
    <!-- Silver Temples -->
    <path d="M68 80 C68 72 72 66 76 64" fill="none" stroke="#d1d5db" stroke-width="2.5" opacity="0.7"/>
    <path d="M132 80 C132 72 128 66 124 64" fill="none" stroke="#d1d5db" stroke-width="2.5" opacity="0.7"/>

    <!-- Ears -->
    <ellipse cx="68" cy="96" rx="4" ry="7" fill="#713f27"/>
    <ellipse cx="132" cy="96" rx="4" ry="7" fill="#713f27"/>

    <!-- Professorial Eyebrows -->
    <path d="M78 82 Q86 78 94 81" fill="none" stroke="#2b2624" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M106 81 Q114 78 122 82" fill="none" stroke="#2b2624" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Touch of grey in eyebrows -->
    <path d="M82 81 L88 80" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M112 80 L118 81" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Warm Eyes Behind Glasses -->
    <ellipse cx="86" cy="90" rx="4.5" ry="3.5" fill="#ffffff"/>
    <circle cx="86" cy="90" r="2.8" fill="#1c1917"/>
    <circle cx="87.5" cy="88.5" r="1" fill="#ffffff"/>

    <ellipse cx="114" cy="90" rx="4.5" ry="3.5" fill="#ffffff"/>
    <circle cx="114" cy="90" r="2.8" fill="#1c1917"/>
    <circle cx="115.5" cy="88.5" r="1" fill="#ffffff"/>

    <!-- Smart Gold / Tortoiseshell Glasses -->
    <!-- Left Rim -->
    <rect x="76" y="82" width="20" height="17" rx="5" fill="none" stroke="url(#glassesGold)" stroke-width="2.5"/>
    <!-- Right Rim -->
    <rect x="104" y="82" width="20" height="17" rx="5" fill="none" stroke="url(#glassesGold)" stroke-width="2.5"/>
    <!-- Bridge -->
    <path d="M96 89 Q100 86 104 89" fill="none" stroke="url(#glassesGold)" stroke-width="2.5"/>
    <!-- Temples -->
    <path d="M76 89 L68 86" stroke="url(#glassesGold)" stroke-width="2"/>
    <path d="M124 89 L132 86" stroke="url(#glassesGold)" stroke-width="2"/>
    <!-- Glass Glint -->
    <path d="M79 85 L84 85" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M107 85 L112 85" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Nose -->
    <path d="M100 90 L98 103 C97 105 103 105 102 103 Z" fill="#512c19"/>
    <ellipse cx="100" cy="104" rx="4" ry="1.8" fill="#422415"/>

    <!-- Wise Mentor Smile -->
    <path d="M88 113 Q100 122 112 113" fill="#ffffff"/>
    <path d="M86 112 C88 113 112 113 114 112" fill="none" stroke="#3b1d10" stroke-width="1.5"/>
  </g>

  <!-- CIM Chief Examiner Shield Badge -->
  <g transform="translate(138, 138)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M20,8 L30,13 L30,22 C30,28 25,32 20,34 C15,32 10,28 10,22 L10,13 Z" fill="#f59e0b"/>
    <text x="20" y="24" font-family="monospace" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">CIM</text>
  </g>
</svg>
